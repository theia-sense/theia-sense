services:
  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      args:
        ML_SERVICE_URL: "http://ml-service:8001"
    container_name: theia-backend
    ports:
      - "8000:8000"
    depends_on:
      ml-service:
        condition: service_healthy
    environment:
      - ML_SERVICE_URL=http://ml-service:8001
    networks:
      - theia-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
  ml-service:
    build:
      context: .
      dockerfile: ./apps/ml-service/Dockerfile
    container_name: theia-ml-service
    ports:
      - "8001:8001"
    environment:
      - LOG_LEVEL=INFO
      - HF_HOME=/code/.hf_cache
    networks:
      - theia-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: theia-frontend
    ports:
      - "3000:80"
    networks:
      - theia-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
  
networks:
  theia-net:
    driver: bridge
    name: theia-net

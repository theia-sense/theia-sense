# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BACKEND_IMAGE_NAME: theia_backend
  ML_SERVICE_IMAGE_NAME: theia_ml_service

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./apps/backend/requirements.txt
          pip install ruff pytest

      - name: Install ML service dependencies
        run: |
          pip install -r ./apps/ml-service/requirements.txt

      - name: Lint with Ruff
        run: ruff check .
      
      - name: Verify ONNX models exist
        run: |
          if [ ! -f "apps/ml-service/new_onnx_models/clip_text.onnx" ] || [ ! -f "apps/ml-service/new_onnx_models/clip_vision.onnx" ]; then
            echo "ERROR: ONNX models not found in new_onnx_models!"
            echo "Available files:"
            ls -la apps/ml-service/new_onnx_models/ || echo "Directory not found"
            exit 1
          fi
          echo "✅ ONNX models found successfully"
          ls -la apps/ml-service/new_onnx_models/

      - name: Run backend tests
        run: |
          cd apps/backend
          pytest tests/test_main.py -v
      
      - name: Run ML service tests
        run: |
          cd apps/ml-service
          pytest tests/test_main.py -v

      - name: Test Docker builds
        run: |
          echo "Testing Docker build for backend..."
          docker build -f ./apps/backend/Dockerfile -t test-backend .
          echo "Testing Docker build for ML service..."
          docker build -f ./apps/ml-service/Dockerfile -t test-ml-service .
          echo "Both Docker builds successful"
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' 
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ML Service Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/ml-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.ML_SERVICE_IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.ML_SERVICE_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
  integration-test:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Compose Configuration
        run: |
          echo "Testing Docker Compose setup..."
          docker-compose -f compose.yml config
          echo "Docker Compose configuration is valid"
      
      - name: Run Integration Tests
        run: |
          echo "Running integration tests..."
          python -m pytest tests/test_integration.py -v
          echo "Integration tests completed successfully"

      - name: Integration test summary
        run: |
          echo "Integration tests completed successfully"
          echo "All 12 integration tests passed"
          echo "Backend image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}"
          echo "ML Service image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.ML_SERVICE_IMAGE_NAME }}:${{ github.sha }}"


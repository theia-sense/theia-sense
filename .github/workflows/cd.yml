name: CD – Deploy to Azure

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# ─── Required secrets ──────────────────────────────────────────────────────────
# AZURE_CREDENTIALS  – JSON output of:
#   az ad sp create-for-rbac --name "github-theia-deploy" \
#     --role Contributor \
#     --scopes /subscriptions/<SUB_ID>/resourceGroups/theia-sense-rg \
#     --sdk-auth
#
# ─── Required vars (Settings → Environments → production → Variables) ──────────
# AZURE_RESOURCE_GROUP  – e.g. theia-sense-rg
# BACKEND_APP_NAME      – e.g. theia-sense-backend
# FRONTEND_APP_NAME     – e.g. theia-sense-frontend
# ───────────────────────────────────────────────────────────────────────────────

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend
        run: |
          az containerapp update \
            --name ${{ vars.BACKEND_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ghcr.io/${{ github.repository_owner }}/theia-backend:${{ env.IMAGE_TAG }}

      - name: Verify backend health
        run: |
          FQDN=$(az containerapp show \
            --name ${{ vars.BACKEND_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Backend FQDN: $FQDN"
          for i in $(seq 1 12); do
            if curl -sf "https://$FQDN/health" | grep -q healthy; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Attempt $i/12 — waiting 10s..."
            sleep 10
          done
          echo "::warning::Backend health check timed out after 2 minutes"

      - name: Deploy frontend
        run: |
          az containerapp update \
            --name ${{ vars.FRONTEND_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ghcr.io/${{ github.repository_owner }}/theia-frontend:${{ env.IMAGE_TAG }}

      - name: Verify frontend health
        run: |
          FQDN=$(az containerapp show \
            --name ${{ vars.FRONTEND_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Frontend FQDN: $FQDN"
          for i in $(seq 1 6); do
            if curl -sf "https://$FQDN/health" | grep -q ok; then
              echo "Frontend is healthy"
              exit 0
            fi
            echo "Attempt $i/6 — waiting 10s..."
            sleep 10
          done
          echo "::warning::Frontend health check timed out after 1 minute"
